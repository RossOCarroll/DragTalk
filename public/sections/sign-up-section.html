<section class="sign-up-section">
  <h1 class="section-title">SIGN UP</h1>

  <form class="signup-form">
    <div class="form-field full">
      <label for="email">Email</label>
      <input type="email" id="email" />
    </div>
  
    <div class="form-field">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" />
    </div>
  
    <div class="form-field">
      <label for="last_name">Last name</label>
      <input type="text" id="last_name" />
    </div>
  
    <div class="form-field full">
      <label for="country">Country</label>
      <select id="country">
        <option>-</option>
      </select>
    </div>

    <div class="marketing full">
      <div class="checkbox-row">
        <input type="checkbox" id="marketing_email" name="marketing_email">
        <label for="marketing_email">I agree to receive emails about news, shows and releases.</label>
      </div>
      <p class="privacy-note">Your information will be handled in accordance with our Privacy Policy.</p>
    </div>
    
    <div class="form-actions full">
      <button type="submit" class="button signup-button">
        Sign Up
      </button>
    </div>
  </form>
  
</section>
