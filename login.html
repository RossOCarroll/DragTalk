<head>

  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>main{text-align:center;flex-direction:column;justify-content:center;align-items:center;min-height:80vh;display:flex}main h1{text-transform:uppercase;letter-spacing:.12em;margin-bottom:1.5rem;font-family:Funnel Sans,sans-serif;font-size:1.8rem;font-weight:300}.login-form{background:var(--card-bg);border-top:3px solid var(--gold);border-radius:3px;width:100%;max-width:350px;padding:2rem;box-shadow:0 24px 70px #00000080,0 0 0 1px #e0b46a40}.login-form input{border:1px solid var(--border-strong);width:100%;color:var(--text-light);--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background:0 0;border-radius:.25rem;margin-bottom:1rem;padding:.75rem;font-family:Funnel Sans,sans-serif;font-size:1rem}.login-form input:focus{border-color:var(--gold);outline:none}.login-form button{background-color:var(--gold);color:#2a0f0a;letter-spacing:.05em;cursor:pointer;border:none;border-radius:2rem;width:100%;padding:.75rem;font-size:1rem;font-weight:600;transition:opacity .2s}.login-form button:hover{opacity:.85}.error-msg{color:#e0847a;margin-bottom:1rem;font-size:.9rem}</style>

<body>
  <main>
    <h1>Admin Login</h1>
    <form class="login-form" id="loginForm">
      <p class="error-msg hidden" id="errorMsg"></p>
      <input type="email" id="username" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
